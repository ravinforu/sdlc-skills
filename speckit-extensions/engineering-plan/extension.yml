schema_version: "1.0"
extension:
  id: engineering-plan
  name: Engineering Plan
  version: "1.1.0"
  description: Architecture, design, security, standards and traceable tasks across the Spec Kit feature workflow.
requires:
  speckit_version: ">=1.2.0,<2.0.0"
provides:
  commands:
    - name: speckit.engineering-plan.prepare-constitution
      file: commands/prepare-constitution.md
      description: Prepare Engineering Plan guidance before constitution
    - name: speckit.engineering-plan.prepare-specify
      file: commands/prepare-specify.md
      description: Prepare Engineering Plan guidance before specify
    - name: speckit.engineering-plan.prepare-clarify
      file: commands/prepare-clarify.md
      description: Prepare Engineering Plan guidance before clarify
    - name: speckit.engineering-plan.prepare-plan
      file: commands/prepare-plan.md
      description: Prepare Engineering Plan guidance before plan
    - name: speckit.engineering-plan.prepare-tasks
      file: commands/prepare-tasks.md
      description: Prepare Engineering Plan guidance before tasks
    - name: speckit.engineering-plan.prepare-implement
      file: commands/prepare-implement.md
      description: Prepare Engineering Plan guidance before implement
    - name: speckit.engineering-plan.configure
      file: commands/configure.md
      description: Apply the Engineering Plan constitution principle
    - name: speckit.engineering-plan.spec-check
      file: commands/spec-check.md
      description: Check feature scope and acceptance criteria
    - name: speckit.engineering-plan.design
      file: commands/design.md
      description: Complete the feature architecture and engineering design
    - name: speckit.engineering-plan.task-check
      file: commands/task-check.md
      description: Check tasks against requirements, design and security
    - name: speckit.engineering-plan.verify
      file: commands/verify.md
      description: Record implementation evidence and remaining gaps
hooks:
  before_constitution:
    command: speckit.engineering-plan.prepare-constitution
    optional: false
    priority: 20
    description: Apply Engineering Plan before constitution.
  after_constitution:
    command: speckit.engineering-plan.configure
    optional: false
    priority: 20
    description: Apply Engineering Plan after constitution.
  before_specify:
    command: speckit.engineering-plan.prepare-specify
    optional: false
    priority: 20
    description: Apply Engineering Plan before specify.
  after_specify:
    command: speckit.engineering-plan.spec-check
    optional: false
    priority: 20
    description: Apply Engineering Plan after specify.
  before_clarify:
    command: speckit.engineering-plan.prepare-clarify
    optional: false
    priority: 20
    description: Apply Engineering Plan before clarify.
  after_clarify:
    command: speckit.engineering-plan.spec-check
    optional: false
    priority: 20
    description: Apply Engineering Plan after clarify.
  before_plan:
    command: speckit.engineering-plan.prepare-plan
    optional: false
    priority: 20
    description: Apply Engineering Plan before plan.
  after_plan:
    command: speckit.engineering-plan.design
    optional: false
    priority: 20
    description: Apply Engineering Plan after plan.
  before_tasks:
    command: speckit.engineering-plan.prepare-tasks
    optional: false
    priority: 20
    description: Apply Engineering Plan before tasks.
  after_tasks:
    command: speckit.engineering-plan.task-check
    optional: false
    priority: 20
    description: Apply Engineering Plan after tasks.
  before_implement:
    command: speckit.engineering-plan.prepare-implement
    optional: false
    priority: 20
    description: Apply Engineering Plan before implement.
  after_implement:
    command: speckit.engineering-plan.verify
    optional: false
    priority: 20
    description: Apply Engineering Plan after implement.
tags:
  - architecture
  - planning
  - security
  - engineering
