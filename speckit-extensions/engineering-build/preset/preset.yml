schema_version: "1.0"
preset:
  id: engineering-build-preset
  name: Engineering Build Stage Wraps
  version: "2.1.0"
  description: Wraps clarify, plan, tasks and implement so the engineering-build extension runs its companion-skill bindings at the exact point inside each stage.
  license: MIT
requires:
  speckit_version: ">=1.2.0,<2.0.0"
  extensions:
    - id: engineering-build
      version: ">=2.0.0,<3.0.0"
      required: true
provides:
  templates:
    - { type: command, name: speckit.clarify,   file: commands/speckit.clarify.md,   strategy: wrap }
    - { type: command, name: speckit.plan,      file: commands/speckit.plan.md,      strategy: wrap }
    - { type: command, name: speckit.tasks,     file: commands/speckit.tasks.md,     strategy: wrap }
    - { type: command, name: speckit.implement, file: commands/speckit.implement.md, strategy: wrap }
tags:
  - sdlc
  - skills
