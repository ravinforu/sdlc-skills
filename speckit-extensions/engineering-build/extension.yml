schema_version: "1.0"
extension:
  id: engineering-build
  name: Engineering Build
  version: "2.1.0"
  description: Engineering Build across the Spec Kit workflow, calling pinned companion skills (grill-me, database-schema-designer, api-designer, playwright-expert, ponytail, engineering-vulnerability-upgrade) at the right stage through a binding registry.
  license: MIT
requires:
  speckit_version: ">=1.2.0,<2.0.0"
provides:
  commands:
    # Before hooks: prepare each stage
    - name: speckit.engineering-build.prepare-constitution
      file: commands/prepare-constitution.md
      description: Prepare Engineering Build guidance before constitution
    - name: speckit.engineering-build.prepare-specify
      file: commands/prepare-specify.md
      description: Prepare Engineering Build guidance before specify
    - name: speckit.engineering-build.prepare-clarify
      file: commands/prepare-clarify.md
      description: Prepare Engineering Build guidance before clarify
    - name: speckit.engineering-build.prepare-plan
      file: commands/prepare-plan.md
      description: Prepare Engineering Build guidance before plan
    - name: speckit.engineering-build.prepare-tasks
      file: commands/prepare-tasks.md
      description: Prepare Engineering Build guidance before tasks
    - name: speckit.engineering-build.prepare-implement
      file: commands/prepare-implement.md
      description: Prepare Engineering Build guidance before implement
    # After hooks: complete and check each stage
    - name: speckit.engineering-build.configure
      file: commands/configure.md
      description: Apply the Engineering Build constitution principle
    - name: speckit.engineering-build.spec-check
      file: commands/spec-check.md
      description: Check feature scope and acceptance criteria
    - name: speckit.engineering-build.design
      file: commands/design.md
      description: Complete the feature architecture and engineering design
    - name: speckit.engineering-build.task-check
      file: commands/task-check.md
      description: Check tasks against requirements, design and security
    - name: speckit.engineering-build.verify
      file: commands/verify.md
      description: Record implementation evidence and remaining gaps
    # Companion skills: the binding runner and its helpers
    - name: speckit.engineering-build.run
      file: commands/run.md
      description: Apply the companion-skill bindings for a stage
    - name: speckit.engineering-build.edge-case-audit
      file: commands/edge-case-audit.md
      description: Check every edge-case lens is answered or marked N/A
    - name: speckit.engineering-build.vuln-intake
      file: commands/vuln-intake.md
      description: Ask for flow, Agility ticket, branch and base branch, then read the vulnerability report
    - name: speckit.engineering-build.vuln-pr
      file: commands/vuln-pr.md
      description: Raise one PR per changed repo when every build passed
  config:
    - name: engineering-build-config.yml
      template: config/engineering-build-config.template.yml
      description: Companion-skill binding registry and settings
      required: true
hooks:
  before_constitution:
    command: speckit.engineering-build.prepare-constitution
    optional: false
    priority: 20
    description: Apply Engineering Build before constitution.
  after_constitution:
    command: speckit.engineering-build.configure
    optional: false
    priority: 20
    description: Apply Engineering Build after constitution.
  before_specify:
    command: speckit.engineering-build.prepare-specify
    optional: false
    priority: 20
    description: Apply Engineering Build before specify.
  after_specify:
    command: speckit.engineering-build.spec-check
    optional: false
    priority: 20
    description: Apply Engineering Build after specify.
  before_clarify:
    command: speckit.engineering-build.prepare-clarify
    optional: false
    priority: 20
    description: Apply Engineering Build before clarify; runs the grill-me binding if the preset has not.
  after_clarify:
    command: speckit.engineering-build.spec-check
    optional: false
    priority: 20
    description: Apply Engineering Build after clarify, including the edge-case audit.
  before_plan:
    command: speckit.engineering-build.prepare-plan
    optional: false
    priority: 20
    description: Apply Engineering Build before plan.
  after_plan:
    command: speckit.engineering-build.design
    optional: false
    priority: 20
    description: Complete the design; makes sure the database and API bindings ran.
  before_tasks:
    command: speckit.engineering-build.prepare-tasks
    optional: false
    priority: 20
    description: Apply Engineering Build before tasks.
  after_tasks:
    command: speckit.engineering-build.task-check
    optional: false
    priority: 20
    description: Check tasks; makes sure the E2E and vulnerability task bindings ran.
  before_implement:
    command: speckit.engineering-build.prepare-implement
    optional: false
    priority: 20
    description: Apply Engineering Build before implement.
  after_implement:
    command: speckit.engineering-build.verify
    optional: false
    priority: 20
    description: Record evidence; offers vulnerability-upgrade PRs when the feature has vuln/intake.json.
tags:
  - architecture
  - planning
  - security
  - skills
  - testing
